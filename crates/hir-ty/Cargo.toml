[package]
name = "hir-ty"
version = "0.0.0"
repository.workspace = true
description = "The type system for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
cov-mark = "2.0.0"
itertools.workspace = true
arrayvec.workspace = true
smallvec.workspace = true
ena = "0.14.3"
rustc-demangle = "0.1.28"
serde.workspace = true
serde_derive.workspace = true
either.workspace = true
oorandom = "11.1.5"
tracing = { workspace = true, features = ["attributes"] }
rustc-hash.workspace = true
la-arena.workspace = true
triomphe.workspace = true
unicode-width.workspace = true
indexmap.workspace = true
rustc_apfloat = "0.2.3"
rustc-stable-hash = "0.1.2"
salsa.workspace = true
petgraph.workspace = true
bitflags.workspace = true

ra-ap-rustc_abi.workspace = true
ra-ap-rustc_index.workspace = true
ra-ap-rustc_ast_ir.workspace = true
ra-ap-rustc_type_ir.workspace = true
ra-ap-rustc_next_trait_solver.workspace = true

# These moved to dev deps if `setup_tracing` was a macro and dependents also
# included these
tracing-subscriber.workspace = true
tracing-tree.workspace = true

# local deps
stdx.workspace = true
macros.workspace = true
intern.workspace = true
cfg.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
base-db.workspace = true
syntax.workspace = true
span.workspace = true
thin-vec = "0.2.16"

# rustd spike: native codegen from MIR
cranelift-codegen = { version = "0.136", features = ["incremental-cache", "x86", "arm64"] }
cranelift-frontend = "0.136"
cranelift-module = { version = "0.136", features = ["enable-serde"] }
postcard.workspace = true
sha2 = "0.10"
crc32fast = "1"
memmap2 = "0.9"
cranelift-object = "0.136"
target-lexicon = "0.13"
object = { version = "0.37", default-features = false, features = ["read", "std", "elf", "macho", "coff"] }
wasm-encoder = { version = "0.244", default-features = false, features = ["std"] }
# The LLVM backend. Needs LLVM 20 at build time: set `LLVM_SYS_201_PREFIX` to its prefix.
inkwell = { version = "0.9.0", default-features = false, features = ["llvm20-1-prefer-dynamic", "target-x86", "target-aarch64"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1.17"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[features]
in-rust-tree = ["hir-expand/in-rust-tree"]
llvm = ["dep:inkwell"]
# The compiler as a WebAssembly module itself: see `crates/rustd-wasm`.
wasm = []

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["serde"]
